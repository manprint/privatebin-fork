name: Container image

# Builds the container image with docker/Dockerfile and publishes it on the
# GitHub container registry. Pushes happen on `main` and on version tags, pull
# requests only build, so a broken build is caught before the merge.
#
# The image is pushed as ghcr.io/<owner>/<repository>:<branch or tag>. To also
# publish on Docker Hub, add the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets
# and the two steps marked as such below.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Build the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # To also publish on Docker Hub, uncomment this step and add the secrets
      # DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to the repository.
      # - name: Log in to Docker Hub
      #   if: github.event_name != 'pull_request'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract the image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # the base image and the deployment are amd64, add linux/arm64 once
          # that has been tested on real hardware
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report the published tags
        if: github.event_name != 'pull_request'
        run: |
          echo "Published:"
          echo "${{ steps.meta.outputs.tags }}"

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm --entrypoint php \
            "${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.meta.outputs.version }}" \
            /srv/bin/administration --help | head -3
